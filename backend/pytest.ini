[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider
    --color=yes

markers =
    unit: Test unitari veloci (no I/O esterno)
    integration: Test integrazione (chiamate reali ai servizi)
    api: Test endpoint HTTP FastAPI
    sentiment: Test sentiment analysis
    toxicity: Test toxicity detection
    slow: Test lenti (>1s)
    smoke: Test smoke veloci per verifica base
    performance: Test performance e SLA
    edge: Test casi limite (input estremi)

timeout = 30

[coverage:run]
source = .
omit =
    tests/*
    venv/*
    .venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False