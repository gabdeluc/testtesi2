version: "3.8"

services:
  # ============================================
  # BACKEND GATEWAY
  # ============================================
  backend:
    build: ./backend
    container_name: fastapi-backend-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - BERT_SERVICE_URL=http://bert-sentiment:5001
      - TOXICITY_SERVICE_URL=http://bert-toxicity:5003
      # In produzione sostituire con il dominio specifico del frontend
      - CORS_ORIGINS=*
      # ── Integrazione Arianna ──────────────────────────────────────
      # Default false: l'API di Arianna non è ancora disponibile per i test.
      # Quando sarà disponibile:  USE_ARIANNA=true docker compose up
      - USE_ARIANNA=${USE_ARIANNA:-false}
      # ── Soglia tossicità configurabile ────────────────────────────
      # Default 0.6 (60%) — ragionevole ma non universale (cfr. README §12).
      # Per modificare:  TOXICITY_THRESHOLD=0.5 docker compose up
      - TOXICITY_THRESHOLD=${TOXICITY_THRESHOLD:-0.6}
    depends_on:
      bert-sentiment:
        condition: service_healthy
      bert-toxicity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - ml-network

  # ============================================
  # BERT SENTIMENT MICROSERVICE
  # ============================================
  bert-sentiment:
    build: ./services/bert-sentiment
    container_name: bert-sentiment-service
    ports:
      - "5001:5001"
    volumes:
      - bert-model-cache:/app/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/.cache/transformers
      - MODEL_NAME=nlptown/bert-base-multilingual-uncased-sentiment
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    networks:
      - ml-network
    deploy:
      resources:
        limits:
          memory: 2G

  # ============================================
  # BERT TOXICITY MICROSERVICE
  # ============================================
  bert-toxicity:
    build: ./services/bert-toxicity
    container_name: bert-toxicity-service
    ports:
      - "5003:5003"
    volumes:
      - bert-toxicity-cache:/app/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/.cache/transformers
      - MODEL_NAME=gravitee-io/bert-small-toxicity
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    networks:
      - ml-network
    deploy:
      resources:
        limits:
          memory: 1.5G

  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge

volumes:
  bert-model-cache:
    driver: local
  bert-toxicity-cache:
    driver: local